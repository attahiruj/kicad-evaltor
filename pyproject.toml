[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-evaltor"
version = "0.6.1"
description = "Test and validate KiCad designs: schematic values, connectivity, ERC, DRC, board layout and fabrication outputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Attahiru Jibril", email="attahiruj@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.1",
    "mypy>=1.7",
    "types-requests>=2.31",
]
# Online part lookups (kicad_evaltor.sourcing) use only the standard library;
# the extra exists so a caller can state the intent.
sourcing = []

[project.urls]
Homepage = "https://github.com/attahiruj/kicad-evaltor"
Repository = "https://github.com/attahiruj/kicad-evaltor"
Issues = "https://github.com/attahiruj/kicad-evaltor/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kicad_evaltor*"]

[tool.setuptools.package-data]
kicad_evaltor = ["py.typed", "_regulators.json", "_stroke_font_data.json", "_text_placement_data.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running KiCad instance",
    "slow: tests that may take >30s",
    "network: queries live distributor catalogues; runs only with KICAD_EVALTOR_LIVE_SOURCING=1",
]
addopts = "-v --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "ARG", "PTH", "PT", "Q", "RUF", "SIM", "TID", "TRY"]
ignore = ["ANN001", "ANN002", "ANN003", "ARG001", "ARG002", "ANN401", "TRY003", "SIM102", "SIM105", "SIM108", "C901", "RUF012", "RUF022", "RUF046", "E501", "F541", "F821", "TRY300", "UP045", "ANN201", "ANN202", "ANN204", "PT011"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN002", "ANN003", "ARG001", "ARG002", "ANN401", "ANN201", "ANN202", "ANN204", "PT011", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict = false
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src", "tests"]

# Runs under KiCad's bundled interpreter, where pcbnew lives; it has no stubs.
[[tool.mypy.overrides]]
module = "kicad_evaltor._pcbnew_dump"
ignore_errors = true
