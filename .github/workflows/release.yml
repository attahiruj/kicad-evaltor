name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kicad-evaltor
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Verify the tag matches the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-project python -c \
            "import tomllib,sys;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match pyproject version $version" >&2
            exit 1
          fi
      - name: Build
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
